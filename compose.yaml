services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mobdev
      POSTGRES_USER: mobdev
      POSTGRES_PASSWORD: mobdev
    ports:
      - "55432:5432"
    volumes:
      - mobdev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobdev -d mobdev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mobdev-postgres:
